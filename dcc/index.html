<!DOCTYPE html>
<html>
<head>
  <title>DCC Char Sheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <!-- char info -->
    <div class="container">
      <label for="char_crawler_number">Crawler: </label>
      <input id="char_crawler_number" placeholder="Crawler Number" class="invisible-textbox">
      <label for="char_name">Name: </label>
      <input id="char_name" placeholder="Character Name" class="invisible-textbox">
      <label for="char_race">Race: </label>
      <input id="char_race" placeholder="Race" class="invisible-textbox">
      <label for="char_class">Class: </label>
      <input id="char_class" placeholder="Class" class="invisible-textbox">
    </div>

    <br>
    <div class="container">
      <label for="char_level">Level: </label>
      <input id="char_level" placeholder="lvl" class="invisible-textbox">
      <label for="char_floor">Floor: </label>
      <input id="char_floor" placeholder="Floor" class="invisible-textbox">
      <label for="char_gold">Gold: </label>
      <input id="char_gold" placeholder="$" class="invisible-textbox">
      <label for="char_popularity">Popularity: </label>
      <input id="char_popularity" placeholder="0" class="invisible-textbox">
    </div>
    <!-- char info -->


     <!--dicepool area -->
    <div class="container">
      <div class="container" id="check_dicepool">
      </div>
      <hr class="innerbreak">
      <div class="container" id="roll_controls">
        <select name="check_add_die" id="check_add_die">
          <option value="2">d2</option>
          <option value="4">d4</option>
          <option value="6">d6</option>
          <option value="8">d8</option>
          <option value="10">d10</option>
          <option value="12">d12</option>
          <option value="20">d20</option>
          <option value="100">d100</option>
        </select>
        <button onclick="add_die('check')">+ Die</button>
        <button onclick="remove_die('check')">- Die</button>
        <!-- <label for="advantage">Advantage:</label>
        <input type="checkbox" name="advantage" id="advantage"> -->
        <span name="advantage" id="advantage" class="rollmod">Advantage</span>
        <span name="disadvantage" id="disadvantage" class="rollmod">Disadvantage</span>
        <!--<label for="disadvantage">Disadvantage:</label>
        <input type="checkbox" name="disadvantage" id="disadvantage">-->
        <button commandfor="check_dicepool" command="--roll_dice">Roll Check</button>
        <span id="check_bonus"></span>
        <span id="check_result"></span>
      </div>
    </div>
    <div class="container">
      <div class="container" id="damage_dicepool">
      </div>
      <hr class="innerbreak">

      <div class="container" id="damage_roll_controls">
        <select name="damage_add_die" id="damage_add_die">
          <option value="2">d2</option>
          <option value="4">d4</option>
          <option value="6">d6</option>
          <option value="8">d8</option>
          <option value="10">d10</option>
          <option value="12">d12</option>
          <option value="20">d20</option>
          <option value="100">d100</option>
        </select>
        <button onclick="add_die('damage')">+ Die</button>
        <button onclick="remove_die('damage')">- Die</button>
        <button commandfor="damage_dicepool" command="--roll_dice">Roll Damage</button>
        <span id="damage_bonus"></span>
        <span id="damage_result"></span>
      </div>
    </div>


    <hr class="innerbreak">
    <div class="container" id="health">
    </div>

    <hr class="innerbreak">
    <div class="container" id="stats">
    </div>


    <hr class="innerbreak">
    <div class="container">
      <div class="vertical">
        <span>Attack Skills</span>
        <ul id="attack_skills" class="skill">
        </ul>
        <button commandfor="attack_skills" command="--add-skill">+ Attack Skill</button>
      </div>

      <div class="vertical">
        <span>Defense Skills</span>
        <ul id="defense_skills" class="skill">
        </ul>
        <button commandfor="defense_skills" command="--add-skill">+ Defense Skill</button>
      </div>

      <div class="vertical">
        <span>Other Skills</span>
        <ul id="other_skills" class="skill">
        </ul>
        <button commandfor="other_skills" command="--add-skill">+ Other Skill</button>
      </div>
    </div> <!--skills div -->

    <hr class="innerbreak">
    <div class="container">
      <h3>Inventory</h3>
      <hr class="innerbreak">
      <div id="inventory" class="vertical">
      </div>

      <hr class="innerbreak">
      <button commandfor="inventory" command="--add-item">+ item</button>
    </div>

    <div class="container">
      <textarea id="char_notes" placeholder="notes" class="bigtextbox"></textarea>
    </div>

    <hr>
    <button onclick="make_data_url()">Save Stats</button>
    <hr class="innerbreak">
    <div class="container"><textarea id="data-url" class="bigtextbox"></textarea></div>

  </div>

  <script src="scripts.js"></script>
  <script>document.load = setup()</script>
</body>
</html>
