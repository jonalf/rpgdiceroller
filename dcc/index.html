<!DOCTYPE html>
<html>
<head>
  <title>DCC Char Sheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>DCC Char Sheet</h1>

    <div class="container">
      <div class="containter" id="check_dicepool">
      </div>
      <hr class="innerbreak">
      <div class="container" id="roll_controls">
        <label for="advantage">Advantage:</label>
        <input type="checkbox" name="advantage" id="advantage">
        <label for="disadvantage">Disadvantage:</label>
        <input type="checkbox" name="disadvantage" id="disadvantage">
        <button commandfor="check_dicepool" command="--roll_dice">Roll Check</button>
        <span id="check_result"></span>
      </div>
    </div>
    <div class="container">
      <div class="containter" id="damage_dicepool">
      </div>
      <hr class="innerbreak">
      <button commandfor="damage_dicepool" command="--roll_dice">Roll Damage</button>
    </div>
     <!--dicepool area -->

    <!-- char info -->
    <div class="container">
      <label for="char_name">Name: </label>
      <input id="char_name" placeholder="Character Name" class="invisible-textbox"></input>
      <label for="char_race">Race: </label>
      <input id="char_race" placeholder="Race" class="invisible-textbox"></input>
      <label for="char_class">Class: </label>
      <input id="char_class" placeholder="Class" class="invisible-textbox"></input>
    </div>

    <br>
    <div class="containter">
      <label for="char_level">Level: </label>
      <input id="char_level" placeholder="lvl" class="invisible-textbox"></input>
      <label for="char_crawler_number">Crawler: </label>
      <input id="char_crawler_number" placeholder="Crawler Number" class="invisible-textbox"></input>
      <label for="char_floor">Floor: </label>
      <input id="char_floor" placeholder="Floor" class="invisible-textbox"></input>
    </div>

    <hr class="innerbreak">
    <div class="container" id="health">
    </div>

    <hr class="innerbreak">
    <div class="container" id="stats">
    </div>

    <hr class="innerbreak">
    <div class="container" id="attack_skills">
      <h3>Attack Skills</h3>
      <hr class="innerbreak">

      <table id="attack">
        <thead>
          <tr>
            <th scope="row">Select</th>
            <th scope="row">Name</th>
            <th scope="row">Rank</th>
            <th scope="row">Stat</th>
            <th scope="row">Mod</th>
            <th scope="row">Damage</th>
            <th scope="row">Notes</th>
            <th scope="row">Grind</th>
            <th scope="row">Marked</th>
          </tr>
        </thead>
        <tbody id="attack_skill_body">
        </tbody>
      </table>
      <hr class="innerbreak">
      <button commandfor="attack_skill_body" command="--add-skill">+ Attack Skill</button>
    </div>

    <hr class="innerbreak">
    <div class="container" id="defense_skills">
      <h3>Defense Skills</h3>
      <hr class="innerbreak">

      <table id="defense">
        <thead>
          <tr>
            <th scope="row">Name</th>
            <th scope="row">Rank</th>
            <th scope="row">Stat</th>
            <th scope="row">Mod</th>
            <th scope="row">Damage</th>
            <th scope="row">Notes</th>
            <th scope="row">Grind</th>
            <th scope="row">Marked</th>
          </tr>
        </thead>
        <tbody id="defense_skill_body">
        </tbody>
      </table>
      <hr class="innerbreak">
      <button commandfor="defense_skill_body" command="--add-skill">+ Defense Skill</button>
    </div>

    <hr>
    <button onclick="load_make()">Load Mike</button>
    <button onclick="make_data_url()">Save Stats</button>
    <hr class="innerbreak">
    <div class="container"><textarea id="data-url"></textarea></div>

  </div>
